
<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090910">
<title>AIVORA — Your AI Space</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090910;color:#f5f2ff;font-family:Arial,sans-serif;min-height:100vh}
header{padding:25px 20px;text-align:center;border-bottom:1px solid #242033}
.logo{font-size:30px;font-weight:800;letter-spacing:5px}
.tag{color:#a99bc9;font-size:12px;margin-top:7px;letter-spacing:2px}
main{max-width:760px;margin:auto;padding:35px 18px}
h1{text-align:center;font-size:30px;margin:20px 0 10px}
.sub{text-align:center;color:#a8a1b9;line-height:1.6}
.glow{height:130px;background:radial-gradient(ellipse,#6038a955,transparent 70%);margin:-15px auto -55px}
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:30px 0}
.tool{background:#151321;border:1px solid #302744;border-radius:15px;padding:18px;color:white;text-align:left;cursor:pointer}
.tool:active{background:#29203c}
.tool strong{display:block;font-size:16px;margin-bottom:7px}
.tool span{color:#aaa1bb;font-size:12px}
.panel{background:#13111e;border:1px solid #302744;border-radius:18px;padding:18px;margin-top:20px}
.panel h2{font-size:18px;margin-top:0}
textarea,input{width:100%;background:#090910;border:1px solid #39304d;color:white;padding:14px;border-radius:12px;font-size:15px;outline:none}
textarea{min-height:100px;resize:vertical}
button{background:#8060c8;color:white;border:0;border-radius:12px;padding:13px 18px;font-weight:bold;cursor:pointer}
button:active{opacity:.8}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
#result{white-space:pre-wrap;color:#ddd4ef;line-height:1.6;margin-top:15px}
footer{text-align:center;color:#777087;font-size:12px;padding:35px}
.hidden{display:none}
@media(max-width:420px){.tools{grid-template-columns:1fr 1fr}.tool{padding:14px}}
</style>
</head>
<body>
<header>
 <div class="logo">AIVORA</div>
 <div class="tag">YOUR INTELLIGENT SPACE</div>
</header>

<main>
 <div class="glow"></div>
 <h1>What can we create today?</h1>
 <p class="sub">Your ideas. Your plans. Your next step.</p>

 <div class="tools">
  <button class="tool" onclick="openTool('CHAT')"><strong>✦ AI CHAT</strong><span>Talk and explore ideas</span></button>
  <button class="tool" onclick="openTool('PLANNER')"><strong>◈ PLANNER</strong><span>Organize your next steps</span></button>
  <button class="tool" onclick="openTool('BUILDER')"><strong>⌘ BUILDER</strong><span>Build apps and projects</span></button>
  <button class="tool" onclick="openTool('IDEAS')"><strong>✧ AI IDEAS</strong><span>Discover new possibilities</span></button>
  <button class="tool" onclick="openTool('PROJECTS')"><strong>▣ PROJECTS</strong><span>Organize your projects</span></button>
  <button class="tool" onclick="openTool('IMAGE')"><strong>▧ AI IMAGE</strong><span>Image creation workspace</span></button>
  <button class="tool" onclick="openTool('MUSIC')"><strong>♫ AI MUSIC</strong><span>Music creation workspace</span></button>
  <button class="tool" onclick="openTool('DOCUMENTS')"><strong>▤ DOCUMENTS</strong><span>Work with your text</span></button>
 </div>

 <section class="panel" id="workspace">
  <h2 id="toolTitle">AIVORA CHAT</h2>
  <p class="sub" style="text-align:left">Choose a workspace and write what you want to work on.</p>
  <textarea id="prompt" placeholder="Write your idea here..."></textarea>
  <div class="actions">
   <button onclick="runWorkspace()">Continue</button>
   <button onclick="clearWorkspace()" style="background:#302744">Clear</button>
  </div>
  <div id="result"></div>
 </section>
</main>

<footer>AIVORA © 2026 · Your intelligent space</footer>

<script>
let currentTool="CHAT";

function openTool(name){
 currentTool=name;
 document.getElementById("toolTitle").textContent="AIVORA "+name;
 document.getElementById("prompt").placeholder=
 "Write what you want to do with "+name+"...";
 document.getElementById("result").textContent="";
 document.getElementById("workspace").scrollIntoView({behavior:"smooth"});
}

function runWorkspace(){
 const value=document.getElementById("prompt").value.trim();
 const result=document.getElementById("result");
 if(!value){
  result.textContent="Write something first to continue.";
  return;
 }
 const messages={
  CHAT:"Your message is ready. Connect an AI service to receive an intelligent answer.",
  PLANNER:"Your planning request is saved on this screen. An AI connection is needed to create a full plan.",
  BUILDER:"Your project idea is ready. An AI coding service is needed to build it.",
  IDEAS:"Your idea request is ready. Connect an AI service to generate suggestions.",
  PROJECTS:"Your project details are ready to organize.",
  IMAGE:"The image workspace is ready. An image-generation service is not connected yet.",
  MUSIC:"The music workspace is ready. A music-generation service is not connected yet.",
  DOCUMENTS:"Your document text is ready to work with."
 };
 result.textContent=messages[currentTool]+"\n\nYour text:\n"+value;
}

function clearWorkspace(){
 document.getElementById("prompt").value="";
 document.getElementById("result").textContent="";
}
</script>
</body>
</html>
